[build]
builder = "NIXPACKS"

[deploy]
# Migrations run before the new container takes traffic. Without this, a deploy that adds a column
# serves 500s from the moment it starts until someone remembers to run the migration by hand.
#
# Medical evidence is never written by the automatic deployment hook. A reviewed corpus transition
# is a separate operator action with exact expected-value digests, row locks, and an idempotent
# replay check; see `apply:b1-source-consensus-transition` and docs/deployment.md.
#
# `apply:name-index` writes the searchable-name index into `drug_aliases` for the same reason.
# Search already knew how to use aliases; it had almost none, because only a full ingest wrote any
# and a seeded database wrote none at all. Measured against the label archive, 78% of brand names
# printed on real labels returned nothing. Shipping the index with the deploy means a reader who
# types the name on their box finds the medicine wherever the data is applied.
#
# `agents:import` activates only the checked, post-repair package. It writes append-only run,
# occurrence and membership records plus the mutable current-run pointer; an identical replay is a
# no-op and it never writes a medicine fact.
preDeployCommand = "npm run db:migrate && npm run apply:name-index && npm run agents:import"

healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
