<!-- The two "171"s above and below are the CORPUS SIZE, and this file is the one document the
     build does not generate. Both were "170" until 2026-08-02 while the corpus held 171 — and the
     header on this very page printed "Search 170 compounds" directly above an /az toolbar reading
     "Filter 171 compounds by name…", because that one is interpolated. The placeholder also said
     "pathways" where every prerendered page said "protocols": two headers, one site.
     assertCorpusCountCopy() in build/prerender.js now fails the build on any served document whose
     corpus count disagrees with site/data.js, this file included. When it fails, it prints the
     exact string to type. -->
<header class="topbar">
  <a href="#/" class="brand">🧬 RNA<span>wiki</span></a>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search 171 compounds, protocols, terms…" autocomplete="off" spellcheck="false">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <nav class="topnav">
    <a href="#/solve" class="nav-solve">Solve</a>
    <a href="#/where">Where it hurts</a>

  </nav>

</header>

<main id="app"><!-- rendered by app.js --></main>

<!-- Absolute, not relative (fixed 2026-07-30). With src="data.js", any SPA route with two or
     more path segments resolved these to /exercise/data.js, /fork/data.js, /u/data.js and so on:

     every /fork/<id> share permalink — the URL a reader sends someone else. -->
<script src="/data.js"></script>
<script src="/facts.js"></script>
<script src="/interactions.js"></script>
<script src="/app.js"></script>
