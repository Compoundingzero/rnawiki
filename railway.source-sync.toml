[build]
builder = "NIXPACKS"
# This service runs a bounded TypeScript worker, not the Next.js web process.
# Type-check the worker image without requiring web-only authentication secrets.
buildCommand = "npm run typecheck"

[deploy]
# The web service is the normal migration owner. This guard is repeated here because Railway can
# deploy the scheduled worker independently; new worker code must never start against an older
# schema.
preDeployCommand = "npm run db:migrate"
# ClinicalTrials.gov observations are bounded and idempotent. The process releases its database
# pool and exits after every batch so Railway can schedule the next run cleanly.
startCommand = "npm run sync:clinical-trials -- --limit 25 --concurrency 4"
cronSchedule = "0 */6 * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
