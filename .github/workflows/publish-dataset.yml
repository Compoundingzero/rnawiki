# Keeps data/ in step with the live database.
#
# Runs every day and on demand. Reads production over the public Postgres proxy, regenerates the
# export, and commits only when something actually changed — a run that finds no edits leaves no
# commit, so the history stays a record of the data moving rather than of the clock ticking.
#
# ONE SECRET IS REQUIRED: DATABASE_PUBLIC_URL, the Postgres service's public connection string
# (Railway → Postgres → Variables → DATABASE_PUBLIC_URL). Without it the job skips rather than
# fails, so a fork does not get a permanently red workflow it cannot fix.
name: Publish dataset

on:
  schedule:
    # 03:00 UTC, after the day's ingest would have run.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: publish-dataset
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Check the database secret is present
        id: guard
        run: |
          if [ -z "${{ secrets.DATABASE_PUBLIC_URL }}" ]; then
            echo "DATABASE_PUBLIC_URL is not set; skipping. Add it in Settings → Secrets → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Export the corpus
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          # Railway's Postgres serves a self-signed certificate and publishes no CA, so the
          # connection cannot be verified against the public host. It is encrypted either way, and
          # this job reads a dataset that is public by design.
          DATABASE_SSL_NO_VERIFY: 'true'
          SESSION_SECRET: 'unused-by-the-export-but-required-at-import-time-32'
        run: npx tsx scripts/export/dataset.ts

      - name: Commit only if the data moved
        if: steps.guard.outputs.ready == 'true'
        run: |
          git config user.name 'rnawiki-bot'
          git config user.email 'bot@rnawiki.com'
          git add data/
          if git diff --cached --quiet; then
            echo "No change in the corpus since the last export."
            exit 0
          fi
          ROWS=$(python3 -c "import json;print(json.load(open('data/manifest.json'))['counts']['total'])")
          git commit -m "Publish dataset: ${ROWS} medicines

          Regenerated from the live database by .github/workflows/publish-dataset.yml.
          data/ is a snapshot and is overwritten wholesale on every export; edits happen at
          rnawiki.com, never here."
          git push
