# Keeps data/ in step with the live database.
#
# Runs every day and on demand. Reads production over the public Postgres proxy, regenerates the
# export, and commits only when something actually changed — a run that finds no edits leaves no
# commit, so the history stays a record of the data moving rather than of the clock ticking.
#
# TWO SECRETS ARE REQUIRED. DATASET_DATABASE_URL must belong to a read-only database role, and
# DATABASE_CA_CERT must contain the certificate (or CA) that authenticates the public Postgres
# endpoint. Missing trust material is a failed publication, never a silently skipped or
# certificate-unverified export.
name: Publish dataset

on:
  schedule:
    # 03:00 UTC, after the day's ingest would have run.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: publish-dataset
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the pinned database certificate
        env:
          DATASET_DATABASE_URL: ${{ secrets.DATASET_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          test -n "$DATASET_DATABASE_URL" || { echo "DATASET_DATABASE_URL is required." >&2; exit 1; }
          test -n "$DATABASE_CA_CERT" || { echo "DATABASE_CA_CERT is required." >&2; exit 1; }
          printf '%s\n' "$DATABASE_CA_CERT" > "$RUNNER_TEMP/rnawiki-postgres-ca.pem"
          chmod 600 "$RUNNER_TEMP/rnawiki-postgres-ca.pem"

      - name: Export the corpus
        env:
          DATABASE_URL: ${{ secrets.DATASET_DATABASE_URL }}
          PGSSLROOTCERT: ${{ runner.temp }}/rnawiki-postgres-ca.pem
          SESSION_SECRET: 'unused-by-the-export-but-required-at-import-time-32'
        run: npx tsx scripts/export/dataset.ts

      - name: Check generated reader copy
        run: npm run check:copy

      - name: Commit only if the data moved
        run: |
          git config user.name 'rnawiki-bot'
          git config user.email 'bot@rnawiki.com'
          git add data/
          if git diff --cached --quiet; then
            echo "No change in the corpus since the last export."
            exit 0
          fi
          ROWS=$(python3 -c "import json;print(json.load(open('data/manifest.json'))['counts']['total'])")
          git commit -m "Publish dataset: ${ROWS} medicines

          Regenerated from the live database by .github/workflows/publish-dataset.yml.
          data/ is a snapshot and is overwritten wholesale on every export; edits happen at
          rnawiki.com, never here."
          git push
