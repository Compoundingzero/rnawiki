name: Verify public snapshot readiness

# MANUAL ONLY. This workflow is intentionally unscheduled until all external controls below exist
# and a Postgres recovery policy has been approved. It snapshots only rounded, thresholded public
# vote totals from a dedicated read-only view. It is not a database backup.
#
# Required setup is documented in docs/BACKUP_RECOVERY.md:
#   - PUBLIC_SNAPSHOT_DATABASE_URL: dedicated role, exact view only (never the app DATABASE_URL)
#   - optional PUBLIC_SNAPSHOT_DB_CA: CA bundle when the platform certificate needs one
#   - vars.PUBLIC_SNAPSHOT_REPO: a NEW private owner/repo, never the legacy rnawiki-backups repo
#   - PUBLIC_SNAPSHOT_REPO_TOKEN: fine-grained token limited to that repo, metadata read + contents write
#
# The job verifies the destination is private, rejects the legacy destination, requires a policy
# marker on every non-empty destination, and refuses extra branches or tags. It cannot prove GitHub
# has garbage-collected deleted legacy objects; use a fresh repository and rotate the old key.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: public-snapshot-readiness
  cancel-in-progress: false

jobs:
  verify-and-snapshot:
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_REPO: ${{ vars.PUBLIC_SNAPSHOT_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Enforce public-snapshot privacy contract
        run: npm run test:backup

      - name: Check dedicated credentials
        env:
          PUBLIC_SNAPSHOT_DATABASE_URL: ${{ secrets.PUBLIC_SNAPSHOT_DATABASE_URL }}
          PUBLIC_SNAPSHOT_REPO_TOKEN: ${{ secrets.PUBLIC_SNAPSHOT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$PUBLIC_SNAPSHOT_DATABASE_URL" ] || { echo "::error::Dedicated PUBLIC_SNAPSHOT_DATABASE_URL is not configured."; exit 1; }
          [ -n "$PUBLIC_SNAPSHOT_REPO_TOKEN" ] || { echo "::error::Fine-grained PUBLIC_SNAPSHOT_REPO_TOKEN is not configured."; exit 1; }
          [[ "$SNAPSHOT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::PUBLIC_SNAPSHOT_REPO must be owner/repo."; exit 1; }
          [ "$SNAPSHOT_REPO" != "$GITHUB_REPOSITORY" ] || { echo "::error::The public application repo cannot hold snapshots."; exit 1; }
          [ "$SNAPSHOT_REPO" != "Compoundingzero/rnawiki-backups" ] || { echo "::error::The legacy destination may retain sensitive history. Use a fresh private repo and rotate its key."; exit 1; }

      - name: Verify fresh private destination
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_SNAPSHOT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$SNAPSHOT_REPO" --jq '.visibility')"
          archived="$(gh api "repos/$SNAPSHOT_REPO" --jq '.archived')"
          [ "$visibility" = "private" ] || { echo "::error::Snapshot destination visibility is not private."; exit 1; }
          [ "$archived" = "false" ] || { echo "::error::Snapshot destination is archived."; exit 1; }
          branches="$(gh api --paginate "repos/$SNAPSHOT_REPO/branches" --jq '.[].name')"
          tags="$(gh api --paginate "repos/$SNAPSHOT_REPO/tags" --jq '.[].name')"
          [ -z "$tags" ] || { echo "::error::Snapshot destination has tags; use a fresh policy-v1 repository."; exit 1; }
          [ -z "$branches" ] || [ "$branches" = "main" ] || { echo "::error::Snapshot destination has unexpected branches."; exit 1; }

      - name: Export coarse public signal
        env:
          PUBLIC_SNAPSHOT_DATABASE_URL: ${{ secrets.PUBLIC_SNAPSHOT_DATABASE_URL }}
          PUBLIC_SNAPSHOT_DB_CA: ${{ secrets.PUBLIC_SNAPSHOT_DB_CA }}
        run: node scripts/backup-community.js

      - name: Push verified snapshot
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_SNAPSHOT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          dest="$(mktemp -d)"
          git clone --depth 50 "https://github.com/$SNAPSHOT_REPO.git" "$dest"
          marker="$dest/.rnawiki-public-snapshot-v1"
          if git -C "$dest" rev-parse --verify HEAD >/dev/null 2>&1; then
            [ -f "$marker" ] && [ "$(tr -d '\r\n' < "$marker")" = "public-snapshot-policy-v1" ] || {
              echo "::error::Non-empty destination lacks the public-snapshot-v1 policy marker. Use a fresh repo."; exit 1;
            }
          else
            git -C "$dest" symbolic-ref HEAD refs/heads/main
            printf '%s\n' 'public-snapshot-policy-v1' > "$marker"
          fi
          git -C "$dest" config user.name "rnawiki-public-snapshot-bot"
          git -C "$dest" config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$dest/backups"
          mkdir -p "$dest/backups"
          cp backups/README.md backups/manifest.json backups/vote_totals.json "$dest/backups/"
          git -C "$dest" add -f .rnawiki-public-snapshot-v1 backups
          if git -C "$dest" diff --cached --quiet; then
            echo "No coarse public-signal changes."
          else
            git -C "$dest" commit -m "Coarse public signal snapshot $(date -u +%FT%TZ)"
            git -C "$dest" push origin HEAD:main
            echo "Pushed verified coarse public-signal snapshot."
          fi
