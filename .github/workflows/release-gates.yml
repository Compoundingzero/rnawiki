name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - name: Build, safety, privacy and guidance gates
        run: npm run gate
      - name: Install pinned browser driver for rendered journey tests
        run: npm install --no-save --package-lock=false puppeteer-core@25.6.0
      - name: Rendered mobile journey smoke test
        run: npm run smoke
