name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rnawiki_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rnawiki_release_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - name: Build, safety, privacy and guidance gates
        run: npm run gate
      - name: Real database release journey
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rnawiki_release_test
        run: npm run test:release-db
      - name: Install pinned browser driver for rendered journey tests
        run: npm install --no-save --package-lock=false puppeteer-core@25.6.0
      - name: Rendered mobile journey smoke test
        run: npm run smoke
