name: Verify RNAWiki

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      SITE_URL: http://localhost:3000
      CI: 'true'
    steps:
      # The checked agent package names the immutable corpus commit it read. The release gate
      # verifies those exact historical bytes, so a one-commit shallow checkout is insufficient.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Keep CI on the exact same release contract developers run locally. This includes the copy,
      # medicine, denial-corpus, current-agent, import-contract, public-dataset, audience-coverage,
      # SEO, migration, unit, integration, build and browser gates.
      - name: Run the complete release gate
        run: npm run gate

      - name: Ensure schema generation is clean
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain --untracked-files=all -- db/schema.ts db/migrations/)" ]; then
            echo "Schema generation changed tracked files or created an uncommitted migration:" >&2
            git status --short --untracked-files=all -- db/schema.ts db/migrations/
            exit 1
          fi
